# Configuração para deploy no Netlify.
# Se você não usa Netlify, pode apagar este arquivo sem problema —
# ele só tem efeito se o site for hospedado lá.

[build]
  publish = "."

# Headers de segurança gerais (o Content-Security-Policy já é
# controlado por <meta> em cada página, então não é duplicado aqui
# pra evitar duas políticas divergentes).
# Obs.: não defini Cache-Control agressivo pros arquivos de assets/
# de propósito — como CSS/JS aqui não têm hash no nome do arquivo,
# cache longo faria seus updates futuros não aparecerem pros
# visitantes até o cache expirar. Deixe o padrão do Netlify cuidar
# disso, a menos que você comece a versionar os nomes dos arquivos.
#
# Página de erro 404: nenhuma configuração extra é necessária. O
# Netlify já procura um arquivo `404.html` na raiz do site publicado
# e o serve automaticamente pra qualquer rota que não exista —
# confirmado na documentação oficial (hosts como Netlify e GitHub
# Pages fazem isso por padrão pra sites estáticos sem framework).
# 403.html e 500.html ficam prontos como modelo pro dia em que o
# projeto tiver algum backend/API de verdade (ex.: quando o
# Assessor.IA ou o curso de Banco de Dados expuserem alguma rota) —
# hoje, sendo um site 100% estático, nada do lado do servidor gera
# esses códigos, então essas duas páginas só são alcançadas se algo
# no próprio JS do site linkar pra elas explicitamente.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# NÃO adicione Strict-Transport-Security (HSTS) aqui, de propósito.
# Netlify já injeta esse cabeçalho automaticamente em domínio próprio
# (confirmado na documentação oficial e em relatos da comunidade
# Netlify). Declarar o mesmo cabeçalho de novo aqui não reforça nada
# — gera DOIS cabeçalhos Strict-Transport-Security na mesma resposta,
# o que é inválido (RFC 7230) e é motivo documentado de falha ao
# tentar entrar na lista de preload do HSTS (hstspreload.org). Se um
# dia quiser customizar o max-age/preload, isso se configura direto
# nas configurações de domínio do Netlify, não pelo netlify.toml.
